<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body { margin: 0; padding: 0; background: #0d0d0d; font-family: 'Segoe UI', Arial, sans-serif; color: #f5f5f5; }
    .container { max-width: 560px; margin: 0 auto; padding: 40px 24px; }
    .logo { font-size: 1.8rem; font-weight: 900; color: #f5c518; margin-bottom: 32px; }
    h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 16px; color: #f5f5f5; }
    p { font-size: 1rem; line-height: 1.6; color: #cccccc; margin-bottom: 12px; }
    .code { display: inline-block; font-size: 2rem; font-weight: 900; letter-spacing: 0.3em; color: #f5c518; background: #1a1a1a; border: 1px solid #333; border-radius: 12px; padding: 16px 32px; margin: 20px 0; }
    .footer { margin-top: 40px; padding-top: 20px; border-top: 1px solid #333; font-size: 0.85rem; color: #666; }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">TLTQUIZ</div>
    <h1>Код для сброса пароля</h1>
    <p>Привет, {{ user.first_name }}! Ты запросил сброс пароля.</p>
    <p>Введи этот код на сайте:</p>
    <div class="code">{{ code }}</div>
    <p style="font-size: 0.9rem; color: #888;">Код действует 15 минут. Если ты не запрашивал сброс — просто проигнорируй это письмо.</p>
    <div class="footer">
      TLTQUIZ · Барные квизы в Тольятти<br>
      © 2026 TLTQUIZ · Все права защищены
    </div>
  </div>
</body>
</html>
